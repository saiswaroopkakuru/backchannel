<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>backchannel — Unified 6-in-1 Claude Code Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="mobile-bar">
    <button type="button" class="btn" id="mobileMenuBtn" aria-label="Toggle navigation" aria-expanded="false">Menu</button>
    <span class="brand-name">backchannel</span>
    <span class="stamp" id="mobileSourceBadge">Live</span>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="0.5" y="0.5" width="23" height="23" rx="5" fill="#111111" stroke="#242424" />
          <path d="M5 9.5 H14.5 M14.5 9.5 L11.5 6.5 M14.5 9.5 L11.5 12.5" stroke="#3fc07a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path d="M19 15.5 H9.5 M9.5 15.5 L12.5 12.5 M9.5 15.5 L12.5 18.5" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
        <span class="brand-name">backchannel</span>
      </div>

      <div class="scope-box">
        <label class="scope-label" for="sessionSelect">Session</label>
        <select id="sessionSelect" class="session-select" aria-label="Active Claude Code session"></select>
        <div class="source-switch" role="group" aria-label="Data source">
          <button type="button" id="srcLiveBtn" data-mode="live" aria-pressed="false">Live</button>
          <button type="button" id="srcDemoBtn" data-mode="demo" aria-pressed="false">Demo</button>
        </div>
      </div>

      <div class="scope-box" id="sidebarModeBox" aria-label="Quick mode selector">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
          <span class="scope-label" style="text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:0.04em;">Ponytail</span>
          <span id="sidebarMinimalismValue" style="font-size:11px;color:var(--accent);font-family:var(--mono);font-weight:600;">full</span>
        </div>
        <div class="segmented full-width" role="group" aria-label="Ponytail minimalism mode">
          <button type="button" data-cfg-key="minimalism" data-cfg-val="off">off</button>
          <button type="button" data-cfg-key="minimalism" data-cfg-val="lite">lite</button>
          <button type="button" data-cfg-key="minimalism" data-cfg-val="full">full</button>
          <button type="button" data-cfg-key="minimalism" data-cfg-val="ultra">ultra</button>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;margin-bottom:2px;">
          <span class="scope-label" style="text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:0.04em;">Caveman</span>
          <span id="sidebarVoiceValue" style="font-size:11px;color:var(--accent);font-family:var(--mono);font-weight:600;">terse</span>
        </div>
        <div class="segmented full-width" role="group" aria-label="Caveman voice mode">
          <button type="button" data-cfg-key="voice" data-cfg-val="off">off</button>
          <button type="button" data-cfg-key="voice" data-cfg-val="terse">terse</button>
          <button type="button" data-cfg-key="voice" data-cfg-val="ultra">ultra</button>
          <button type="button" data-cfg-key="voice" data-cfg-val="megacave">mega</button>
        </div>
      </div>

      <div class="nav-group">Agents</div>
      <nav class="nav-list" aria-label="Agent talk views">
        <button type="button" class="nav-item" data-view="overview" aria-current="page">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="8" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="12" cy="12" r="2"/><path d="M5.8 7.1 L10.2 4.9 M5.8 8.9 L10.2 11.1"/></svg>
          <span>Overview</span>
        </button>
        <button type="button" class="nav-item" data-view="transcript">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5 H13.5 V10.5 H6.5 L3.5 13 V10.5 H2.5 Z"/></svg>
          <span>Transcript</span>
        </button>
        <button type="button" class="nav-item" data-view="audit">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 12 V7 M8 12 V3.5 M13 12 V5.5"/></svg>
          <span>Chatter audit</span>
          <span class="nav-count" id="auditFlagCount" hidden>0</span>
        </button>
      </nav>

      <div class="nav-group">Optimize</div>
      <nav class="nav-list" aria-label="Optimization engines">
        <button type="button" class="nav-item" data-view="headroom">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5 H13.5 M4.5 8 H11.5 M6.5 11.5 H9.5"/></svg>
          <span>Headroom</span>
        </button>
        <button type="button" class="nav-item" data-view="graphify">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="3.5" r="1.8"/><circle cx="3.5" cy="11.5" r="1.8"/><circle cx="12.5" cy="11.5" r="1.8"/><path d="M7.1 5.1 L4.4 9.9 M8.9 5.1 L11.6 9.9 M5.3 11.5 H10.7"/></svg>
          <span>Graphify</span>
        </button>
        <button type="button" class="nav-item" data-view="memory">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5.5 6 H10.5 M5.5 9 H9"/></svg>
          <span>Claude-Mem</span>
        </button>
      </nav>

      <div class="nav-group">Suite &amp; share</div>
      <nav class="nav-list" aria-label="Plugin suite and export">
        <button type="button" class="nav-item" data-view="modes">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5 H13.5 M2.5 11 H13.5"/><circle cx="6" cy="5" r="1.5" fill="#000"/><circle cx="10.5" cy="11" r="1.5" fill="#000"/></svg>
          <span>Modes &amp; CLI</span>
        </button>
        <button type="button" class="nav-item" data-view="card">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 7 H9 M5 10 H11"/></svg>
          <span>Share card</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="conn-row">
          <span class="dot" id="connDot"></span>
          <span id="connLabel">Connecting</span>
        </div>
        <div class="sidebar-hint" id="sourceSummary">Loading local store</div>
      </div>
    </aside>

    <main class="canvas">
      <div class="canvas-inner" id="viewRoot">
        <div class="title-row">
          <div class="title-meta">
            <h1>Overview</h1>
            <p class="title-finding">Loading 6-in-1 Claude Code suite telemetry…</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="/charts.js"></script>
  <script src="/topology.js"></script>
  <script src="/graph-view.js"></script>
  <script src="/app.js"></script>
</body>
</html>
