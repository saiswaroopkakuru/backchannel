[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "backchannel"
version = "3.0.0"
description = "Unified 6-in-1 Claude Code plugin & MCP server combining Backchannel, Caveman, Ponytail, Headroom Proxy, OmniRoute chaining, Graphify, and Claude-Mem."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = [
    "claude-code",
    "claude-plugin",
    "mcp",
    "caveman",
    "ponytail",
    "headroom",
    "graphify",
    "claude-mem",
    "proxy",
    "dashboard",
]

[project.urls]
Homepage = "https://github.com/saiswaroopkakuru/backchannel"
Repository = "https://github.com/saiswaroopkakuru/backchannel"

[project.scripts]
backchannel = "backchannel.cli:main"
backchannel-mcp = "backchannel.mcp:run_stdio_server"

[tool.setuptools.packages.find]
include = ["backchannel*"]
